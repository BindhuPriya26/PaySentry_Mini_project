spring.application.name=PaySentry
server.port=8080

spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

paysentry.app.jwt-secret=ChangeThisSecretKeyToAStrongValueWithAtLeast32Characters
paysentry.app.jwt-expiration-ms=86400000
paysentry.app.reset-token-expiration-minutes=15
paysentry.app.admin-email=admin@paysentry.local
paysentry.app.admin-password=Admin@123
paysentry.app.admin-name=System Admin

# Mock-bank authentication is intentionally local-development only. Replace this value before deployment.
paysentry.mock-bank.shared-key=local-development-mock-key

# FCM remains disabled until a Firebase service account file is supplied. WebSocket alerts still work locally.
paysentry.fcm.enabled=false
paysentry.fcm.service-account-path=
