spring.application.name=PaySentry
server.port=8080

spring.datasource.url=${PAYSENTRY_DB_URL}
spring.datasource.username=${PAYSENTRY_DB_USERNAME}
spring.datasource.password=${PAYSENTRY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.error.include-message=never
server.error.include-stacktrace=never

paysentry.app.jwt-secret=${PAYSENTRY_JWT_SECRET:}
paysentry.app.jwt-expiration-ms=${PAYSENTRY_JWT_EXPIRATION_MS:3600000}
paysentry.app.reset-token-expiration-minutes=15
paysentry.app.seed-admin-enabled=${PAYSENTRY_SEED_ADMIN_ENABLED:false}
paysentry.app.admin-email=${PAYSENTRY_ADMIN_EMAIL:}
paysentry.app.admin-password=${PAYSENTRY_ADMIN_PASSWORD:}
paysentry.app.admin-name=${PAYSENTRY_ADMIN_NAME:Local Administrator}

# Never use the mock-bank interface without a per-environment shared key.
paysentry.mock-bank.shared-key=${PAYSENTRY_MOCK_BANK_KEY:}

# Kept deliberately small for a single-node final-year project. Use an edge/API-gateway limiter in production.
paysentry.rate-limit.auth-attempts-per-minute=${PAYSENTRY_AUTH_ATTEMPTS_PER_MINUTE:10}
paysentry.rate-limit.api-requests-per-minute=${PAYSENTRY_API_REQUESTS_PER_MINUTE:120}
paysentry.cors.allowed-origins=${PAYSENTRY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
paysentry.risk.medium-threshold=${PAYSENTRY_RISK_MEDIUM_THRESHOLD:31}
paysentry.risk.high-threshold=${PAYSENTRY_RISK_HIGH_THRESHOLD:71}
paysentry.risk.critical-threshold=${PAYSENTRY_RISK_CRITICAL_THRESHOLD:91}

# OAuth is disabled until every value is supplied through the deployment environment.
paysentry.gmail.enabled=${PAYSENTRY_GMAIL_ENABLED:false}
paysentry.gmail.client-id=${PAYSENTRY_GMAIL_CLIENT_ID:}
paysentry.gmail.client-secret=${PAYSENTRY_GMAIL_CLIENT_SECRET:}
paysentry.gmail.redirect-uri=${PAYSENTRY_GMAIL_REDIRECT_URI:}
paysentry.gmail.encryption-key=${PAYSENTRY_CREDENTIAL_ENCRYPTION_KEY:}
paysentry.gmail.sync-interval-ms=${PAYSENTRY_GMAIL_SYNC_INTERVAL_MS:900000}
paysentry.gmail.max-messages-per-sync=${PAYSENTRY_GMAIL_MAX_MESSAGES_PER_SYNC:25}

# FCM remains disabled until a Firebase service account file is supplied. WebSocket alerts still work locally.
paysentry.fcm.enabled=${PAYSENTRY_FCM_ENABLED:false}
paysentry.fcm.service-account-path=${PAYSENTRY_FCM_SERVICE_ACCOUNT_PATH:}
