spring.datasource.url=${PAYSENTRY_DB_URL}
spring.datasource.username=${PAYSENTRY_DB_USERNAME}
spring.datasource.password=${PAYSENTRY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing PaySentry schema
spring.datasource.hikari.maximum-pool-size=${PAYSENTRY_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${PAYSENTRY_DB_MIN_IDLE:1}
