spring.datasource.url=jdbc:h2:mem:paysentry;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development still requires per-machine secrets; no reusable signing or mock key is shipped.
paysentry.app.jwt-secret=${PAYSENTRY_JWT_SECRET:}
paysentry.app.seed-admin-enabled=${PAYSENTRY_SEED_ADMIN_ENABLED:false}
paysentry.mock-bank.shared-key=${PAYSENTRY_MOCK_BANK_KEY:}
