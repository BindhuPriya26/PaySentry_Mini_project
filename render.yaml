services:
  - type: web
    name: paysentry-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PAYSENTRY_DB_URL
        sync: false
      - key: PAYSENTRY_DB_USERNAME
        sync: false
      - key: PAYSENTRY_DB_PASSWORD
        sync: false
      - key: PAYSENTRY_DB_POOL_SIZE
        value: "2"
      - key: PAYSENTRY_DB_MIN_IDLE
        value: "0"
      - key: PAYSENTRY_JWT_SECRET
        generateValue: true
      - key: PAYSENTRY_JWT_EXPIRATION_MS
        value: "900000"
      - key: PAYSENTRY_REFRESH_TOKEN_EXPIRATION_DAYS
        value: "30"
      - key: PAYSENTRY_MOCK_BANK_KEY
        generateValue: true
      - key: PAYSENTRY_CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYSENTRY_SEED_ADMIN_ENABLED
        value: "false"
      - key: PAYSENTRY_GMAIL_ENABLED
        value: "false"
      - key: PAYSENTRY_FCM_ENABLED
        value: "false"

  - type: web
    name: paysentry-dashboard
    runtime: static
    plan: free
    rootDir: legacy-web-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: ./web-build
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WEBSOCKET_URL
        sync: false
